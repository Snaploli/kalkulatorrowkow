name: Wails Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            output_name: KalkulatorRowkow.app
            asset_name: KalkulatorRowkow-macOS.zip
          - os: windows-latest
            platform: windows/amd64
            output_name: KalkulatorRowkow.exe
            asset_name: KalkulatorRowkow-Windows.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build macOS App
        if: matrix.os == 'macos-latest'
        run: |
          wails build -platform ${{ matrix.platform }}
          cd build/bin
          zip -r ../../${{ matrix.asset_name }} ${{ matrix.output_name }}

      - name: Build Windows App
        if: matrix.os == 'windows-latest'
        run: |
          wails build -platform ${{ matrix.platform }}
          copy build\bin\${{ matrix.output_name }} ${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
